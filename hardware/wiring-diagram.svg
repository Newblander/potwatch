<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1132" viewBox="0 0 1080 1132" font-family="Consolas, 'IBM Plex Mono', monospace">
  <!-- background -->
  <rect width="1080" height="1132" fill="#0d0f0c"/>

  <!-- title -->
  <text x="40" y="50" fill="#e8ece3" font-size="26" font-weight="bold" font-family="'Space Grotesk', 'Segoe UI', sans-serif">PotWatch — wiring diagram</text>
  <text x="1040" y="50" fill="#9aa392" font-size="14" text-anchor="end">PotWatch v4.0 · ESP32-C3 Super Mini</text>
  <line x1="40" y1="66" x2="1040" y2="66" stroke="#262b20" stroke-width="1"/>

  <!-- ═══════════ WIRES (drawn first, boxes overlay pins) ═══════════ -->
  <g fill="none" stroke-width="2.5" stroke-linejoin="round">
    <!-- 3V3 left: ESP 3V3 -> DS18B20 VDD -->
    <polyline points="420,240 335,240 335,205 280,205" stroke="#ff6b6b"/>
    <!-- DS18B20 DATA -> GPIO3 -->
    <polyline points="280,245 360,245 360,330 420,330" stroke="#6fd52e"/>
    <!-- 4.7k pull-up between 3V3 (y=240) and DATA (y=330) at x=395 -->
    <line x1="395" y1="240" x2="395" y2="262" stroke="#6fd52e"/>
    <rect x="387" y="262" width="16" height="46" rx="3" stroke="#6fd52e" fill="#151812"/>
    <line x1="395" y1="308" x2="395" y2="330" stroke="#6fd52e"/>
    <!-- GND left rail -->
    <polyline points="420,280 350,280 350,575" stroke="#9aa392"/>
    <polyline points="350,285 280,285" stroke="#9aa392"/>
    <!-- steel probe tube bonded to GND — shields the sensor on induction hobs -->
    <polyline points="350,315 280,315" stroke="#9aa392" stroke-dasharray="6 4"/>
    <polyline points="350,460 250,460" stroke="#9aa392"/>
    <polyline points="350,575 250,575" stroke="#9aa392"/>
    <!-- BTN OK -> GPIO7 -->
    <polyline points="250,430 420,430" stroke="#4ecbd4"/>
    <!-- BTN SET -> GPIO10 -->
    <polyline points="250,545 390,545 390,470 420,470" stroke="#4ecbd4"/>

    <!-- 3V3 right rail -->
    <polyline points="660,240 690,240 690,210 780,210" stroke="#ff6b6b"/>
    <polyline points="690,240 690,390 780,390" stroke="#ff6b6b"/>
    <!-- GND right rail -->
    <polyline points="660,280 710,280 710,240 780,240" stroke="#9aa392"/>
    <polyline points="710,280 710,625 800,625" stroke="#9aa392"/>
    <polyline points="710,420 780,420" stroke="#9aa392"/>
    <!-- SDA: GPIO4 -> OLED + BMP280 -->
    <polyline points="660,330 750,330 750,300 780,300" stroke="#5f7ff5"/>
    <polyline points="750,330 750,480 780,480" stroke="#5f7ff5"/>
    <!-- SCL: GPIO5 -> OLED + BMP280 -->
    <polyline points="660,370 730,370 730,270 780,270" stroke="#f5c542"/>
    <polyline points="730,370 730,450 780,450" stroke="#f5c542"/>
    <!-- Buzzer: GPIO6 -> piezo + -->
    <polyline points="660,470 680,470 680,590 800,590" stroke="#e07be0"/>
  </g>

  <!-- junction dots -->
  <g>
    <circle cx="395" cy="240" r="4" fill="#ff6b6b"/>
    <circle cx="395" cy="330" r="4" fill="#6fd52e"/>
    <circle cx="350" cy="285" r="4" fill="#9aa392"/>
    <circle cx="350" cy="315" r="4" fill="#9aa392"/>
    <circle cx="350" cy="460" r="4" fill="#9aa392"/>
    <circle cx="690" cy="240" r="4" fill="#ff6b6b"/>
    <circle cx="710" cy="280" r="4" fill="#9aa392"/>
    <circle cx="710" cy="420" r="4" fill="#9aa392"/>
    <circle cx="750" cy="330" r="4" fill="#5f7ff5"/>
    <circle cx="730" cy="370" r="4" fill="#f5c542"/>
  </g>

  <!-- pull-up label (rotated alongside resistor) -->
  <text transform="translate(378,306) rotate(-90)" fill="#6fd52e" font-size="11">4.7 kΩ pull-up</text>

  <!-- ═══════════ ESP32-C3 SUPER MINI ═══════════ -->
  <rect x="420" y="180" width="240" height="390" rx="14" fill="#151812" stroke="#6fd52e" stroke-width="1.5"/>
  <rect x="510" y="173" width="60" height="14" rx="5" fill="#262b20" stroke="#9aa392" stroke-width="1"/>
  <text x="540" y="164" fill="#9aa392" font-size="10" text-anchor="middle">USB-C · flash only</text>
  <text x="540" y="527" fill="#e8ece3" font-size="17" font-weight="bold" text-anchor="middle" font-family="'Space Grotesk', 'Segoe UI', sans-serif">ESP32-C3</text>
  <text x="540" y="548" fill="#9aa392" font-size="13" text-anchor="middle" font-family="'Space Grotesk', 'Segoe UI', sans-serif">Super Mini</text>

  <!-- left pins -->
  <g font-size="12">
    <rect x="414" y="236" width="12" height="8" fill="#ff6b6b"/>  <text x="434" y="244" fill="#ff6b6b">3V3</text>
    <rect x="414" y="276" width="12" height="8" fill="#9aa392"/>  <text x="434" y="284" fill="#9aa392">GND</text>
    <rect x="414" y="326" width="12" height="8" fill="#6fd52e"/>  <text x="434" y="334" fill="#6fd52e">GPIO3 · 1-Wire</text>
    <rect x="414" y="426" width="12" height="8" fill="#4ecbd4"/>  <text x="434" y="434" fill="#4ecbd4">GPIO7 · OK</text>
    <rect x="414" y="466" width="12" height="8" fill="#4ecbd4"/>  <text x="434" y="474" fill="#4ecbd4">GPIO10 · SET</text>
  </g>
  <!-- right pins -->
  <g font-size="12" text-anchor="end">
    <rect x="654" y="236" width="12" height="8" fill="#ff6b6b"/>  <text x="646" y="244" fill="#ff6b6b">3V3</text>
    <rect x="654" y="276" width="12" height="8" fill="#9aa392"/>  <text x="646" y="284" fill="#9aa392">GND</text>
    <rect x="654" y="326" width="12" height="8" fill="#5f7ff5"/>  <text x="646" y="334" fill="#5f7ff5">GPIO4 · SDA</text>
    <rect x="654" y="366" width="12" height="8" fill="#f5c542"/>  <text x="646" y="374" fill="#f5c542">GPIO5 · SCL</text>
    <rect x="654" y="466" width="12" height="8" fill="#e07be0"/>  <text x="646" y="474" fill="#e07be0">GPIO6 · buzzer</text>
  </g>

  <!-- ═══════════ DS18B20 ═══════════ -->
  <rect x="60" y="175" width="220" height="150" rx="12" fill="#151812" stroke="#262b20" stroke-width="1.5"/>
  <text x="80" y="207" fill="#e8ece3" font-size="15" font-weight="bold" font-family="'Space Grotesk', 'Segoe UI', sans-serif">DS18B20</text>
  <text x="80" y="225" fill="#9aa392" font-size="11">waterproof probe</text>
  <rect x="80" y="245" width="130" height="12" rx="6" fill="none" stroke="#9aa392" stroke-width="1.5"/>
  <text x="80" y="282" fill="#9aa392" font-size="11">in steel thermowell</text>
  <g font-size="11" text-anchor="end">
    <rect x="274" y="201" width="12" height="8" fill="#ff6b6b"/>  <text x="268" y="209" fill="#ff6b6b">VDD</text>
    <rect x="274" y="241" width="12" height="8" fill="#6fd52e"/>  <text x="268" y="249" fill="#6fd52e">DATA</text>
    <rect x="274" y="281" width="12" height="8" fill="#9aa392"/>  <text x="268" y="289" fill="#9aa392">GND</text>
    <rect x="274" y="311" width="12" height="8" fill="#9aa392"/>  <text x="268" y="319" fill="#9aa392">TUBE</text>
  </g>

  <!-- ═══════════ BUTTONS ═══════════ -->
  <rect x="80" y="415" width="170" height="60" rx="12" fill="#151812" stroke="#262b20" stroke-width="1.5"/>
  <text x="100" y="441" fill="#e8ece3" font-size="14" font-weight="bold" font-family="'Space Grotesk', 'Segoe UI', sans-serif">OK button</text>
  <text x="100" y="459" fill="#9aa392" font-size="11">momentary, to GND</text>
  <rect x="244" y="426" width="12" height="8" fill="#4ecbd4"/>
  <rect x="244" y="456" width="12" height="8" fill="#9aa392"/>

  <rect x="80" y="530" width="170" height="60" rx="12" fill="#151812" stroke="#262b20" stroke-width="1.5"/>
  <text x="100" y="556" fill="#e8ece3" font-size="14" font-weight="bold" font-family="'Space Grotesk', 'Segoe UI', sans-serif">SET button</text>
  <text x="100" y="574" fill="#9aa392" font-size="11">momentary, to GND</text>
  <rect x="244" y="541" width="12" height="8" fill="#4ecbd4"/>
  <rect x="244" y="571" width="12" height="8" fill="#9aa392"/>

  <!-- ═══════════ OLED ═══════════ -->
  <rect x="780" y="180" width="240" height="140" rx="12" fill="#151812" stroke="#262b20" stroke-width="1.5"/>
  <text x="1004" y="207" fill="#e8ece3" font-size="15" font-weight="bold" text-anchor="end" font-family="'Space Grotesk', 'Segoe UI', sans-serif">OLED 128×64</text>
  <text x="1004" y="225" fill="#9aa392" font-size="11" text-anchor="end">SSD1306</text>
  <text x="1004" y="243" fill="#6fd52e" font-size="11" text-anchor="end">I²C addr 0x3C</text>
  <g font-size="11">
    <rect x="774" y="206" width="12" height="8" fill="#ff6b6b"/>  <text x="794" y="214" fill="#ff6b6b">VCC</text>
    <rect x="774" y="236" width="12" height="8" fill="#9aa392"/>  <text x="794" y="244" fill="#9aa392">GND</text>
    <rect x="774" y="266" width="12" height="8" fill="#f5c542"/>  <text x="794" y="274" fill="#f5c542">SCL</text>
    <rect x="774" y="296" width="12" height="8" fill="#5f7ff5"/>  <text x="794" y="304" fill="#5f7ff5">SDA</text>
  </g>

  <!-- ═══════════ BMP280 ═══════════ -->
  <rect x="780" y="360" width="240" height="140" rx="12" fill="#151812" stroke="#262b20" stroke-width="1.5"/>
  <text x="1004" y="390" fill="#e8ece3" font-size="15" font-weight="bold" text-anchor="end" font-family="'Space Grotesk', 'Segoe UI', sans-serif">BMP280</text>
  <text x="1004" y="408" fill="#9aa392" font-size="11" text-anchor="end">barometric pressure</text>
  <text x="1004" y="426" fill="#6fd52e" font-size="11" text-anchor="end">I²C addr 0x76</text>
  <g font-size="11">
    <rect x="774" y="386" width="12" height="8" fill="#ff6b6b"/>  <text x="794" y="394" fill="#ff6b6b">VCC</text>
    <rect x="774" y="416" width="12" height="8" fill="#9aa392"/>  <text x="794" y="424" fill="#9aa392">GND</text>
    <rect x="774" y="446" width="12" height="8" fill="#f5c542"/>  <text x="794" y="454" fill="#f5c542">SCL</text>
    <rect x="774" y="476" width="12" height="8" fill="#5f7ff5"/>  <text x="794" y="484" fill="#5f7ff5">SDA</text>
  </g>

  <!-- ═══════════ BUZZER ═══════════ -->
  <rect x="800" y="555" width="220" height="95" rx="12" fill="#151812" stroke="#262b20" stroke-width="1.5"/>
  <text x="1004" y="588" fill="#e8ece3" font-size="15" font-weight="bold" text-anchor="end" font-family="'Space Grotesk', 'Segoe UI', sans-serif">Piezo buzzer</text>
  <text x="1004" y="606" fill="#9aa392" font-size="11" text-anchor="end">passive</text>
  <g font-size="12">
    <rect x="794" y="586" width="12" height="8" fill="#e07be0"/>  <text x="814" y="595" fill="#e07be0">+</text>
    <rect x="794" y="621" width="12" height="8" fill="#9aa392"/>  <text x="814" y="630" fill="#9aa392">−</text>
  </g>

  <!-- ═══════════ POWER SUPPLY ═══════════ -->
  <text x="40" y="700" fill="#6fd52e" font-size="12" letter-spacing="3" font-weight="bold">POWER SUPPLY</text>
  <line x1="40" y1="710" x2="1040" y2="710" stroke="#262b20" stroke-width="1"/>

  <!-- power wires first -->
  <g fill="none" stroke-width="2.5" stroke-linejoin="round">
    <!-- battery -> charger -->
    <polyline points="250,770 330,770" stroke="#ffa94e"/>
    <polyline points="250,830 330,830" stroke="#9aa392"/>
    <!-- charger OUT -> step-down module -->
    <polyline points="580,770 660,770" stroke="#ffa94e"/>
    <polyline points="580,830 660,830" stroke="#9aa392"/>
    <!-- regulator VOUT -> power switch -> 3V3 net tag -->
    <polyline points="870,770 885,770" stroke="#ff6b6b"/>
    <line x1="885" y1="770" x2="921" y2="752" stroke="#ff6b6b"/>
    <polyline points="925,770 940,770" stroke="#ff6b6b"/>
    <!-- GND net tag -->
    <polyline points="620,830 620,874 940,874" stroke="#9aa392"/>
  </g>
  <circle cx="620" cy="830" r="4" fill="#9aa392"/>

  <!-- power switch contacts + label -->
  <circle cx="885" cy="770" r="3.5" fill="#0d0f0c" stroke="#ff6b6b" stroke-width="1.5"/>
  <circle cx="925" cy="770" r="3.5" fill="#0d0f0c" stroke="#ff6b6b" stroke-width="1.5"/>
  <text x="905" y="740" fill="#ff6b6b" font-size="10" text-anchor="middle">power switch</text>

  <!-- net tags -->
  <text x="948" y="774" fill="#ff6b6b" font-size="12">→ 3V3 rail</text>
  <text x="948" y="790" fill="#9aa392" font-size="10">(ESP32 3V3 pin)</text>
  <text x="948" y="878" fill="#9aa392" font-size="12">→ GND rail</text>

  <!-- battery -->
  <rect x="60" y="740" width="190" height="120" rx="12" fill="#151812" stroke="#262b20" stroke-width="1.5"/>
  <text x="80" y="775" fill="#e8ece3" font-size="15" font-weight="bold" font-family="'Space Grotesk', 'Segoe UI', sans-serif">Li-ion cell</text>
  <text x="80" y="793" fill="#9aa392" font-size="11">3.7 V nominal</text>
  <text x="80" y="809" fill="#9aa392" font-size="11">LiPo 802060</text>
  <rect x="80" y="824" width="40" height="18" rx="3" fill="none" stroke="#9aa392" stroke-width="1.5"/>
  <rect x="120" y="829" width="5" height="8" fill="#9aa392"/>
  <g font-size="11" text-anchor="end">
    <rect x="244" y="766" width="12" height="8" fill="#ffa94e"/>  <text x="238" y="774" fill="#ffa94e">B+</text>
    <rect x="244" y="826" width="12" height="8" fill="#9aa392"/>  <text x="238" y="834" fill="#9aa392">B−</text>
  </g>

  <!-- TP4056 charger -->
  <rect x="330" y="720" width="250" height="160" rx="12" fill="#151812" stroke="#262b20" stroke-width="1.5"/>
  <rect x="427" y="713" width="56" height="14" rx="5" fill="#262b20" stroke="#9aa392" stroke-width="1"/>
  <text x="455" y="704" fill="#9aa392" font-size="10" text-anchor="middle">USB-C · 5 V in</text>
  <text x="455" y="775" fill="#e8ece3" font-size="15" font-weight="bold" text-anchor="middle" font-family="'Space Grotesk', 'Segoe UI', sans-serif">TP4056</text>
  <text x="455" y="793" fill="#9aa392" font-size="11" text-anchor="middle">USB-C charger module</text>
  <text x="455" y="809" fill="#9aa392" font-size="11" text-anchor="middle">with battery protection</text>
  <g font-size="11">
    <rect x="324" y="766" width="12" height="8" fill="#ffa94e"/>  <text x="344" y="774" fill="#ffa94e">B+</text>
    <rect x="324" y="826" width="12" height="8" fill="#9aa392"/>  <text x="344" y="834" fill="#9aa392">B−</text>
  </g>
  <g font-size="11" text-anchor="end">
    <rect x="574" y="766" width="12" height="8" fill="#ffa94e"/>  <text x="566" y="774" fill="#ffa94e">OUT+</text>
    <rect x="574" y="826" width="12" height="8" fill="#9aa392"/>  <text x="566" y="834" fill="#9aa392">OUT−</text>
  </g>

  <!-- 3.3 V step-down module -->
  <rect x="660" y="740" width="210" height="120" rx="12" fill="#151812" stroke="#262b20" stroke-width="1.5"/>
  <text x="765" y="786" fill="#e8ece3" font-size="14" font-weight="bold" text-anchor="middle" font-family="'Space Grotesk', 'Segoe UI', sans-serif">3.3 V step-down</text>
  <text x="765" y="804" fill="#9aa392" font-size="10.5" text-anchor="middle">switching module</text>
  <g font-size="11">
    <rect x="654" y="766" width="12" height="8" fill="#ffa94e"/>  <text x="674" y="774" fill="#ffa94e">VIN</text>
    <rect x="654" y="826" width="12" height="8" fill="#9aa392"/>  <text x="674" y="834" fill="#9aa392">GND</text>
  </g>
  <g font-size="11" text-anchor="end">
    <rect x="864" y="766" width="12" height="8" fill="#ff6b6b"/>  <text x="856" y="774" fill="#ff6b6b">VOUT</text>
  </g>

  <!-- ═══════════ NOTES ═══════════ -->
  <rect x="40" y="920" width="1000" height="182" rx="12" fill="#151812" stroke="#262b20" stroke-width="1.5"/>
  <g fill="#9aa392" font-size="12">
    <text x="60" y="950"><tspan fill="#6fd52e">•</tspan> Power: cell → TP4056 → 3.3 V step-down → switch → ESP32 3V3 pin.</text>
    <text x="60" y="978"><tspan fill="#6fd52e">•</tspan> Use a charger module with battery protection on board.</text>
    <text x="60" y="1006"><tspan fill="#6fd52e">•</tspan> Switching regulator; a linear substitute must be true low-dropout.</text>
    <text x="60" y="1034"><tspan fill="#6fd52e">•</tspan> Board USB-C = flashing only; disconnect battery while flashing.</text>
    <text x="555" y="950"><tspan fill="#6fd52e">•</tspan> DS18B20 data needs a 4.7 kΩ pull-up to 3.3 V.</text>
    <text x="555" y="978"><tspan fill="#6fd52e">•</tspan> OLED (0x3C) + BMP280 (0x76) share I²C: SDA GPIO4, SCL GPIO5.</text>
    <text x="555" y="1006"><tspan fill="#6fd52e">•</tspan> Buttons to GND (internal pull-ups); piezo direct on GPIO6.</text>
    <text x="555" y="1034"><tspan fill="#6fd52e">•</tspan> Schematic view — physical pin order on the boards differs.</text>
    <text x="60" y="1062"><tspan fill="#ffa94e">•</tspan> Bond the steel probe tube to GND (dashed) and bed the sensor in</text>
    <text x="60" y="1084">  thermal paste — this is what stops induction hobs killing the DS18B20.</text>
  </g>
</svg>
